name: Quality Assurance & Security Scan

on:
  push:
    branches: ["main"]

jobs:
  test-code:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Latest Code
        uses: actions/checkout@v4
      
      - name: Run Integrity Scan
        run: |
          echo "Starting System Integrity Scan..."
          if [ ! -f index.html ]; then
            echo "CRITICAL ERROR: Main index.html file is missing! Deployment blocked."
            exit 1
          fi
          echo "Integrity Check Passed: Core files detected."
          
      - name: Run Security Scan
        run: |
          echo "Starting Security Scan..."
          if grep -q "malicious_code" index.html; then
            echo "SECURITY BREACH: Unauthorized code detected!"
            exit 1
          else
            echo "Security Check Passed: Code is clean and safe for production."
          fi
          - name: Content & Spelling Check
        run: |
          echo "Checking for common presentation errors..."
          # Example: Check if the word 'TODO' was left in the code
          if grep -qi "TODO" index.html; then
            echo "WARNING: You left a 'TODO' note in your code! Please clean it up."
            exit 1
          fi
          
          # Example: Check for a specific common spelling mistake (e.g., 'Recieve' instead of 'Receive')
          if grep -qi "recieve" index.html; then
            echo "SPELLING ERROR: Found 'recieve'. Please correct it to 'receive'."
            exit 1
          fi
          echo "Content check passed!"
