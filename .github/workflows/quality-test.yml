name: Enterprise Quality & Security Suite

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  issues: write

jobs:
  inspection:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Code
        uses: actions/checkout@v4

      - name: Install Professional Inspector
        run: npm install -g htmlhint

      - name: Run Deep HTML Validation
        run: |
          echo "Starting deep structure scan..."
          htmlhint index.html --rules "tag-pair,attr-lowercase,spec-char-escape,id-unique"

      - name: Run Security & Content Scan
        run: |
          echo "Checking for unauthorized strings..."
          if grep -qiE "malicious_code|abcdef|TODO" index.html; then
            echo "ERROR: Quality Gate Failed."
            exit 1
          fi

      - name: Auto-Create Bug Ticket
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "🚨 Pipeline Failure: Code Quality Breach" --body "The Enterprise CI Pipeline caught an error before deployment. Please check the Action logs and fix the code." --assignee "Yuvan-08"
