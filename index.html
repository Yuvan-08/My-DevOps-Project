<div style="position: absolute; top: 20px; left: 20px; z-index: 1000; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 10px; color: white; font-family: sans-serif; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(10px);">
    <h3 style="margin-top: 0; font-size: 16px;">Edge Network Telemetry</h3>
    <button id="live-demo-btn" style="padding: 10px 15px; font-weight: bold; cursor: pointer; background: #00ffcc; border: none; border-radius: 5px; color: black;">Fetch Live Destinations</button>
    <div id="demo-output" style="margin-top: 15px; font-size: 14px; line-height: 1.5;"></div>
</div>

<script>
    document.getElementById('live-demo-btn').addEventListener('click', async () => {
        const output = document.getElementById('demo-output');
        output.innerHTML = "Connecting to backend server...";
        
        try {
            // Your live Render API URL is injected right here:
            const response = await fetch('https://wanderlust-backend-0m49.onrender.com/api/destinations');
            const data = await response.json();
            
            output.innerHTML = `
                <span style="color: #00ffcc;">✅ Secure Connection Established</span><br><br>
                <b>1. ${data[0].name}</b> (${data[0].type})<br>
                <b>2. ${data[1].name}</b> (${data[1].type})<br>
                <b>3. ${data[2].name}</b> (${data[2].type})
            `;
        } catch (error) {
            output.innerHTML = "<span style='color: #ff4444;'>❌ Connection failed.</span>";
            console.error(error);
        }
    });
</script>
