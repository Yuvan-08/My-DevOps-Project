<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Enterprise-grade travel experiences curated for the modern explorer.">
    <title>Discover the Unseen with Yuvan!</title>
    
    <!-- Tailwind CSS for enterprise-grade styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 3D WebGL Engines -->
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/globe.gl"></script>
</head>
<body class="bg-black text-white m-0 p-0 overflow-x-hidden">

    <!-- Transparent Navigation Bar -->
    <nav class="absolute top-0 w-full z-20 flex justify-between items-center p-6 bg-gradient-to-b from-black/80 to-transparent">
        <div class="text-2xl font-bold tracking-widest text-white drop-shadow-lg">WANDERLUST</div>
        <button class="bg-emerald-500 hover:bg-emerald-400 text-black font-bold py-2 px-6 rounded-full transition-all">
            Book Now
        </button>
    </nav>

    <!-- 3D Interactive Hero Section -->
    <main id="globe-container" class="w-full h-screen relative flex justify-center items-center cursor-crosshair">
        
        <!-- Floating Text Overlay -->
        <div class="absolute z-10 pointer-events-none text-center flex flex-col items-center justify-center h-full">
            <h1 class="text-5xl md:text-7xl font-extrabold text-white mb-6 drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)]">
                Discover the Unseen with Yuvan!
            </h1>
            <p class="text-xl md:text-2xl text-gray-200 drop-shadow-md bg-black/40 px-6 py-3 rounded-full border border-gray-600/50 backdrop-blur-sm">
                Click any glowing destination on the globe to explore.
            </p>
        </div>

        <!-- The 3D Globe automatically renders inside this div -->
        <div id="globeViz" class="w-full h-full"></div>

    </main>

    <!-- 3D Engine Initialization Logic -->
    <script>
        // Generate enterprise travel destinations
        const destinations = [
            { lat: 48.8566, lng: 2.3522, name: "Paris, France", color: "#00ffea" },
            { lat: 35.6762, lng: 139.6503, name: "Tokyo, Japan", color: "#ff00aa" },
            { lat: 40.7128, lng: -74.0060, name: "New York, USA", color: "#00ffea" },
            { lat: -33.8688, lng: 151.2093, name: "Sydney, Australia", color: "#ff00aa" },
            { lat: 28.6139, lng: 77.2090, name: "New Delhi, India", color: "#00ffea" },
            { lat: 25.2048, lng: 55.2708, name: "Dubai, UAE", color: "#ff00aa" },
            { lat: -22.9068, lng: -43.1729, name: "Rio de Janeiro, Brazil", color: "#00ffea" }
        ];

        // Initialize the 3D World
        const elem = document.getElementById('globeViz');
        const world = Globe()
            (elem)
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
            .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
            .backgroundColor('rgba(0,0,0,0)') // Keeps the background transparent to blend with CSS
            .labelsData(destinations)
            .labelLat(d => d.lat)
            .labelLng(d => d.lng)
            .labelText(d => d.name)
            .labelSize(1.5)
            .labelDotRadius(0.5)
            .labelColor(d => d.color)
            .labelResolution(2)
            .onLabelClick(d => {
                // The "Go Inside" Camera Effect
                world.pointOfView({ lat: d.lat, lng: d.lng, altitude: 0.2 }, 1500);
                setTimeout(() => {
                    alert("Welcome to " + d.name + "! \nEnterprise Deployment Successful.");
                }, 1600);
            });

        // Auto-spin the globe
        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 1.0;

        // Make the globe responsive if the user resizes their browser
        window.addEventListener('resize', () => {
            world.width(elem.clientWidth);
            world.height(elem.clientHeight);
        });
    </script>
</body>
</html>
